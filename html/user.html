<!DOCTYPE html>
<html lang="bs">
    <head><link rel="stylesheet" href="../css/user.css">
    <meta charset="UTF-8">
    </head>
    <body>
        <form class="forma">
        <h1>Postavke korisničkog računa</h1>
        <hr>
        <p>Upravljajte vašim korisničkim računom, sigurnosnim postavkama i notifikacijama</p>
        <div class="podaci">
            <h2>Podaci o korisničkom računu</h2>
            <label for="imeprezime">Ime i prezime</label>
            <input type="text" id="imeprezime" placeholder="John Doe">
            <label for="email-input">Email adresa</label>
            <input type="text" id="email-input" placeholder="john.doe@example.com">
            <label for="br_elemenata">Broj elemenata po stranici</label>
            <input type="number" id="br_elemenata" min="1" max="100" value="25">
        </div>
        <div class="sigurnost">
            <h2>Sigurnosne postavke</h2>
            <label for="pwd">Nova šifra</label>
            <input type="password" id="pwd" placeholder="••••••••"><br>
            <input type="checkbox" id="authentication" name="authentication" value="auth" >
            <label for="authentication">Omogući Two-Factor Authentication (2FA)</label>
        </div>
        <div class="notifications">
            <h2>Notifikacije</h2>
                <label class="main-label">Preferirani način komunikacije</label>
                <div class="radio-container">
                <input type="radio" id="email-radio" name="contact" value="Email">
                <label for="email-radio">Email</label>
                <input type="radio" id="SMS" name="contact" value="SMS">
                <label for="SMS">SMS</label>
                <input type="radio" id="none" name="contact" value="None">
                <label for="none">None</label><br>
                </div>
                <label for="frequency">Notification frequency</label>
                <select id="frequency">
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                    <option value="monthly">Monthly</option>
                    <option value="never">Never</option>
                </select>
            </div>
            <hr>
            <button type="submit" id="save">Spasi promjene</button>
        </form>
    </body>
</html>
