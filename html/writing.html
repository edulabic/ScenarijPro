<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="../css/writing.css">
    </head>
    <body>
        <div id="zaglavlje">
            <div class="left-section">
            <a href="#" class="back-arrow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            </a>

            <h1>TIHI GRAD (Draft 2)</h1>
            </div>
            <div class="buttons">
            <input type="button" id="scena" value="SCENA">
            <input type="button" id="akcija" value="AKCIJA">
            <input type="button" id="lik" value="LIK">
            <input type="button" id="dijalog" value="DIJALOG">
            </div>
            <input type="button" id="spasi" value="SPASI">
        </div>

        <div class="content-wrapper">
        <div id="sidebar">
            <h1>Scene (3)</h1>
            <ul class="scene-list">
                <li class="scene-item active">
                    <div class="scene-title">1. INT. STARA KUĆA - NOĆ</div>
                    <div class="scene-pages">(4/8)</div>
                </li>
                <li class="scene-item">
                    <div class="scene-title">2. EXT. GRADSKI TRG - DAN</div>
                    <div class="scene-pages">(2/8)</div>
                </li>
                <li class="scene-item">
                    <div class="scene-title">3. INT. KAFIĆ - VEČER</div>
                    <div class="scene-pages">(3/8)</div>
                </li>
            </ul>
        </div>
        
        <div style="flex: 1;">
            <div id="toolbar">
                <button id="boldBtn"><b>B</b></button>
                <button id="italicBtn"><i>I</i></button>
                <button id="underlineBtn"><u>U</u></button>
                <button id="brojRijeciBtn">Broj riječi</button>
                <button id="ulogeBtn">Uloge</button>
                <button id="pogresneUlogeBtn">Pogrešne uloge</button>          
                <div >
                <label for="ulogaInput"></label>
                <input type="text" id="ulogaInput" placeholder="Unesite ime uloge">
                <button id="brojLinijaBtn">Broj linija</button>
                <button id="scenarijUlogeBtn">Scenarij</button>
                <button id="grupisiUlogeBtn">Grupiši uloge</button>
                </div>

            </div>
<div id="promjena">
    <div class="input-group">
        <label for="userIdInput">User ID:</label>
        <input type="number" id="userIdInput" placeholder="1" value="1">
        
        <label for="scenarioIdInput">Scenario ID:</label>
        <input type="number" id="scenarioIdInput" placeholder="1" value="1">
        
        <button id="loadScenarioBtn">Učitaj scenario</button>

        <input type="text" id="newScenarioTitle" placeholder="Naslov scenarija">
<button id="createScenarioBtn">Kreiraj scenarij</button>

    </div>

    <div class="input-group">
        <label>Ime lika:</label>
        <input type="text" id="characterName" placeholder="Unesite ime">
        <button id="lockCharacterBtn">Zaključaj lika</button>
    </div>

    <div class="input-group">
        <label>Promjena imena:</label>
        <input type="text" id="oldCharacterName" placeholder="Staro ime">
        <input type="text" id="newCharacterName" placeholder="Novo ime">
        <button id="renameCharacterBtn">Preimenuj lika</button>
    </div>
</div> 

<div id="lockStatus" style="margin-top:8px; font-size:14px; color:#555;">
    Nema zaključane linije
</div>

            
            <div id="poruke"></div>

            <div id="editor" contenteditable="true" >
               
            </div>
        </div>
        </div>
        

        <script src="../PoziviAjaxFetch.js"></script>
        <script src="../js/EditorTeksta.js"></script>
        <script src="../js/editor.js"></script>

    </body>
</html>
