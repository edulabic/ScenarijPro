services:
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wt26
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - arm-network

  node-app:
    build: .
    container_name: node-app
    environment:
      DB_HOST: mysql-db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: wt26
    ports:
      - "3000:3000"
    depends_on:
      - mysql-db
    networks:
      - arm-network

networks:
  arm-network:
    driver: bridge

volumes:
  mysql-data:
